<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>2048</h1>
      <div class="score-box">
        <span class="score-label">Очки</span>
        <span id="score" class="score-value">0</span>
      </div>
    </header>

    <div class="toolbar">
      <button id="undo-btn" type="button">↶ Отмена хода</button>
      <button id="restart-btn" type="button">⟳ Заново</button>
      <button id="leaders-btn" type="button">🏆 Рекорды</button>
    </div>

    <div class="board-wrap">
      <div id="board" class="board">
        <div id="grid" class="grid"></div>
        <div id="tiles" class="tiles"></div>
      </div>

      <div id="gameover" class="gameover hidden">
        <p id="gameover-msg" class="gameover-msg">Игра окончена! Ваш счёт: 0</p>
        <input id="name-input" type="text" maxlength="20" placeholder="Ваше имя" autocomplete="off">
        <div class="gameover-actions">
          <button id="save-btn" type="button">Сохранить результат</button>
          <button id="gameover-restart" type="button" class="icon-btn" aria-label="Начать заново" title="Начать заново">⟳</button>
        </div>
      </div>
    </div>

    <div id="controls" class="controls">
      <button type="button" data-dir="up" class="c-up" aria-label="Вверх">▲</button>
      <button type="button" data-dir="left" class="c-left" aria-label="Влево">◀</button>
      <button type="button" data-dir="down" class="c-down" aria-label="Вниз">▼</button>
      <button type="button" data-dir="right" class="c-right" aria-label="Вправо">▶</button>
    </div>

    <p class="hint">Стрелки на клавиатуре — движение плиток. На телефоне — свайп по полю.</p>
  </main>

  <div id="leaders-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="leaders-title">
    <div class="modal-box">
      <h2 id="leaders-title">Таблица рекордов</h2>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>#</th><th>Имя</th><th>Очки</th><th>Дата</th></tr>
          </thead>
          <tbody id="leaders-body"></tbody>
        </table>
      </div>
      <p id="leaders-empty" class="empty hidden">Пока нет сохранённых рекордов</p>
      <button id="leaders-close" type="button">Закрыть</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
